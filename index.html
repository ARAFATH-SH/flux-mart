<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Google Search SEO Meta Tags -->
    <title>Flux Market — Next-Gen Curated E-Commerce & Creator Marketplace</title>
    <meta name="title" content="Flux Market — Next-Gen Curated E-Commerce & Creator Marketplace" />
    <meta name="description" content="Shop exclusive drops across premium electronics, streetwear fashion, smart home decor, and lifestyle gear. Fast 2-day delivery, real-time order tracking, and 100% verified merchant guarantee." />
    <meta name="keywords" content="Flux Market, online shopping, curated marketplace, electronics, streetwear, active noise cancellation, smart home, live order tracking, verified sellers" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="canonical" href="https://fluxmarket.app/" />

    <!-- Open Graph / Facebook / WhatsApp SEO Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fluxmarket.app/" />
    <meta property="og:title" content="Flux Market — Next-Gen Curated E-Commerce Marketplace" />
    <meta property="og:description" content="Shop trending tech drops, streetwear fashion, and home decor with real-time order tracking and verified buyer protection." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=1200&h=630&fit=crop" />
    <meta property="og:site_name" content="Flux Market" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card SEO Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://fluxmarket.app/" />
    <meta name="twitter:title" content="Flux Market — Next-Gen Curated E-Commerce Marketplace" />
    <meta name="twitter:description" content="Shop exclusive drops across tech, fashion, and lifestyle. Fast 2-day shipping & live courier tracking." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=1200&h=630&fit=crop" />

    <!-- Google Structured JSON-LD Schema (Rich Snippets) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Flux Market",
        "url": "https://fluxmarket.app/",
        "description": "Next-Gen Curated E-Commerce & Creator Marketplace",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://fluxmarket.app/#shop?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Flux Market Inc.",
        "url": "https://fluxmarket.app/",
        "logo": "https://fluxmarket.app/logo.png",
        "sameAs": [
          "https://twitter.com/fluxmarket",
          "https://instagram.com/fluxmarket"
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
